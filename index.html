<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC Part 5 & 6 | Polytech Lille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f1f3d;
  --navy-light:#1c2f52;
  --gold:#c8a24a;
  --gold-light:#e0c589;
  --cream:#faf6ec;
  --cream-dark:#f0e9d8;
  --text:#1c2230;
  --muted:#6b6f7d;
  --ok:#3f7a4f;
  --bad:#a4372d;
  --border:#ddd3b8;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Source Serif 4',serif;
  background:var(--cream);
  color:var(--text);
  min-height:100vh;
}
header{
  background:var(--navy);
  color:var(--cream);
  padding:28px 24px 22px;
  text-align:center;
  border-bottom:4px solid var(--gold);
}
header h1{
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:1.7rem;
  margin:0 0 6px;
  letter-spacing:.3px;
}
header p{
  margin:0;
  color:var(--gold-light);
  font-size:.95rem;
  letter-spacing:.5px;
}
.wrap{max-width:880px;margin:0 auto;padding:24px 20px 60px;}

.nav-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;margin-bottom:22px;
  position:sticky;top:10px;z-index:50;
  box-shadow:0 4px 12px rgba(21,34,56,0.12);
}
.nav-bar select{
  font-family:'Source Serif 4',serif;
  font-size:1rem;padding:8px 12px;border-radius:6px;
  border:1px solid var(--border);background:var(--cream);color:var(--text);
  flex:1;min-width:180px;
}
.nav-bar button{
  font-family:'Source Serif 4',serif;
  background:var(--navy);color:var(--cream);border:none;
  padding:9px 16px;border-radius:6px;cursor:pointer;font-size:1rem;
}
.nav-bar button:disabled{opacity:.35;cursor:not-allowed;}
.nav-bar button:hover:not(:disabled){background:var(--navy-light);}

.status-line{
  font-size:.85rem;color:var(--muted);margin:-10px 0 20px;text-align:center;
}

.locked-panel, .closed-panel{
  background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:40px 30px;text-align:center;
}
.closed-panel{border-color:var(--bad);}
.locked-panel h2, .closed-panel h2{
  font-family:'Playfair Display',serif;color:var(--navy);margin-top:0;
}
.closed-panel h2{color:var(--bad);}
.lock-icon{font-size:2.4rem;margin-bottom:10px;}

.test-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;margin-top:18px;
}
.test-tile{
  border:1px solid var(--border);border-radius:8px;padding:12px;
  background:var(--cream-dark);font-size:.85rem;
}
.test-tile.avail{background:#eaf3ec;border-color:var(--ok);color:var(--ok);font-weight:600;}
.test-tile.future{background:#fdf6e3;border-color:var(--gold);color:#8a6d1c;}

.q-card{
  background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:26px 28px;margin-bottom:18px;
}
.q-num{
  display:inline-block;background:var(--navy);color:var(--gold-light);
  font-family:'JetBrains Mono',monospace;font-size:.8rem;
  padding:3px 10px;border-radius:20px;margin-bottom:12px;
}
.q-sentence{font-size:1.12rem;line-height:1.6;margin-bottom:18px;}
.q-sentence .blank{color:var(--gold);font-weight:600;letter-spacing:1px;}
.options{display:grid;gap:8px;}
.opt{
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--border);border-radius:7px;padding:10px 14px;
  cursor:pointer;transition:.15s;background:var(--cream);
}
.opt:hover{border-color:var(--gold);}
.opt.selected{border-color:var(--navy);background:#eef1f7;}
.opt.correct{border-color:var(--ok);background:#eaf3ec;}
.opt.incorrect{border-color:var(--bad);background:#f7eae8;}
.opt .letter{
  font-family:'JetBrains Mono',monospace;font-weight:600;
  color:var(--navy);width:20px;
}
.explanation{
  margin-top:14px;padding:14px 16px;border-left:3px solid var(--gold);
  background:var(--cream-dark);font-size:.92rem;line-height:1.55;color:var(--text);
  border-radius:0 6px 6px 0;
}
.explanation em{color:var(--navy);font-style:normal;font-weight:600;}

.score-panel{
  background:var(--navy);color:var(--cream);border-radius:10px;
  padding:26px;text-align:center;margin-bottom:20px;
}
.score-panel h2{font-family:'Playfair Display',serif;margin:0 0 8px;color:var(--gold-light);}
.score-panel .big{font-size:2.2rem;font-weight:700;color:var(--gold);}

.check-btn{
  display:block;width:100%;margin-top:8px;
  font-family:'Source Serif 4',serif;font-size:1rem;
  background:var(--gold);color:var(--navy);border:none;font-weight:600;
  padding:12px;border-radius:7px;cursor:pointer;
}
.check-btn:hover{background:var(--gold-light);}
.check-btn:disabled{opacity:.4;cursor:not-allowed;}

footer{
  text-align:center;padding:26px 20px 40px;color:var(--muted);font-size:.8rem;
  border-top:1px solid var(--border);margin-top:30px;
}
footer strong{color:var(--navy);}

/* Part 6 — passage-based test */
.p6-timer{
  font-family:'JetBrains Mono',monospace;font-weight:600;font-size:1.05rem;
  background:var(--navy);color:var(--gold-light);border:1px solid var(--gold);
  padding:6px 14px;border-radius:6px;display:inline-block;margin-left:10px;
}
.p6-timer.low{background:#3a1f1a;color:#e8c4b8;border-color:var(--bad);}
.p6-passage{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:22px;overflow:hidden;}
.p6-passage-head{background:var(--cream-dark);padding:12px 18px;border-bottom:1px solid var(--border);}
.p6-passage-head .label{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--navy-light);}
.p6-passage-head .meta{font-size:.83rem;color:var(--muted);margin-top:3px;}
.p6-passage-body{padding:18px 20px;white-space:pre-line;font-size:1rem;}
.p6-blank{display:inline-block;background:var(--gold);color:var(--navy);font-family:'JetBrains Mono',monospace;
  font-size:.72rem;font-weight:700;padding:1px 6px;border-radius:3px;margin:0 2px;}
.p6-qblock{border-top:1px dashed var(--border);padding:14px 20px;}
.p6-qblock .qnum{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--navy-light);margin-bottom:8px;font-size:.9rem;}
.p6-qblock label{display:block;padding:7px 10px;margin-bottom:5px;border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:.92rem;background:var(--cream);}
.p6-qblock label:hover{border-color:var(--gold);}
.p6-qblock input[type=radio]{margin-right:8px;}
.p6-correction{background:#fff;border:1px solid var(--border);border-left:4px solid var(--bad);border-radius:8px;padding:16px 18px;margin-bottom:14px;}
.p6-correction .qref{font-family:'JetBrains Mono',monospace;font-size:.78rem;color:var(--navy-light);margin-bottom:6px;}
.p6-correction .your{color:var(--bad);font-weight:600;}
.p6-correction .good{color:var(--ok);font-weight:600;}
.p6-correction .explain{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:.92rem;}
.p6-allcorrect{text-align:center;color:var(--ok);font-weight:600;padding:18px;}
.mini-section-title{
  font-family:'Playfair Display',serif;color:var(--navy);
  font-size:1.15rem;margin:28px 0 14px;padding-bottom:8px;
  border-bottom:2px solid var(--gold);
}
.mini-section-title:first-child{margin-top:0;}
</style>
</head>
<body>

<header>
  <h1>TOEIC® Part 5 &amp; 6</h1>
  <p>Part 5 : 10 tests &middot; 30 phrases chacun &nbsp;|&nbsp; Part 6 : textes à trous</p>
</header>

<div class="wrap" id="app">
  <div class="status-line" id="statusLine">Chargement...</div>
</div>

<footer>
  <strong>Marc Vasseur</strong> | POLYTECH LILLE &middot; marc.vasseur@polytech-lille.fr
  <div style="margin-top:8px;"><a href="admin.html" style="color:var(--muted);font-size:.75rem;text-decoration:none;border-bottom:1px dotted var(--muted);">Administration</a></div>
</footer>

<script>
const DATA_URL = 'data.json';
const ACCESS_URL = 'access.json?t=' + Date.now();

let QUESTIONS = null;
let ACCESS = null;
let currentTest = null;
let answers = {};      // { qnum: 'A' }
let checked = {};      // { qnum: true }

function resetAllTestTimers(){
  if(p5Interval){ clearInterval(p5Interval); p5Interval = null; }
  if(p6Interval){ clearInterval(p6Interval); p6Interval = null; }
  if(miniInterval){ clearInterval(miniInterval); miniInterval = null; }
  p5Submitted = false; answers = {}; checked = {}; p5TimeLeft = P5_DURATION;
  p6Submitted = false; p6Answers = {}; p6TimeLeft = P6_DURATION;
  miniSubmitted = false; miniAnswers = {}; miniTimeLeft = MINI_DURATION;
}

const app = document.getElementById('app');
const statusLine = document.getElementById('statusLine');

async function boot(){
  try{
    const [q, a] = await Promise.all([
      fetch(DATA_URL).then(r=>r.json()),
      fetch(ACCESS_URL).then(r=>r.json())
    ]);
    QUESTIONS = q;
    ACCESS = a;
    render();
  }catch(e){
    app.innerHTML = '<div class="locked-panel"><div class="lock-icon">&#9888;</div><h2>Erreur de chargement</h2><p>Impossible de charger les données. Contactez votre enseignant.</p></div>';
  }
}

function isPart6(tid){ return typeof tid === 'string' && tid.startsWith('p6-'); }
function isMini(tid){ return typeof tid === 'string' && tid.startsWith('mini-'); }

function isTestAvailable(tid){
  let t;
  if(isPart6(tid)) t = (ACCESS.tests_p6 || {})[tid.slice(3)];
  else if(isMini(tid)) t = (ACCESS.tests_mini || {})[tid.slice(5)];
  else t = ACCESS.tests[tid];
  if(!t || !t.unlocked) return {avail:false, future:false};
  if(t.unlock_date){
    const d = new Date(t.unlock_date);
    if(d.getTime() > Date.now()) return {avail:false, future:true, date:d};
  }
  return {avail:true, future:false};
}

function render(){
  statusLine.textContent = '';

  if(ACCESS.closed){
    app.innerHTML = `
      <div class="closed-panel">
        <div class="lock-icon">&#128274;</div>
        <h2>Session fermée</h2>
        <p>L'accès aux tests est actuellement fermé par votre enseignant.</p>
      </div>`;
    return;
  }

  if(currentTest && isTestAvailable(currentTest).avail){
    if(isPart6(currentTest)) renderPart6Test(currentTest);
    else if(isMini(currentTest)) renderMiniTest(currentTest);
    else renderTest(currentTest);
    return;
  }

  currentTest = null;
  renderTestPicker();
}

function allTestIds(){
  const p5Ids = Object.keys(QUESTIONS).filter(k=>k!=='p6' && k!=='mini').sort((a,b)=>+a-+b);
  const p6Ids = QUESTIONS.p6 ? Object.keys(QUESTIONS.p6).sort((a,b)=>+a-+b).map(id=>'p6-'+id) : [];
  const miniIds = QUESTIONS.mini ? Object.keys(QUESTIONS.mini).sort((a,b)=>+a-+b).map(id=>'mini-'+id) : [];
  return p5Ids.concat(p6Ids).concat(miniIds);
}

function testLabel(tid){
  if(isPart6(tid)) return `Part 6 — Test ${tid.slice(3)}`;
  if(isMini(tid)) return `Mini Test ${tid.slice(5)}`;
  return `Part 5 — Test ${tid}`;
}

function renderTestPicker(){
  const tiles = allTestIds().map(tid=>{
    const st = isTestAvailable(tid);
    let cls = 'test-tile', label = testLabel(tid);
    if(st.avail){ cls += ' avail'; label += ' — disponible'; }
    else if(st.future){ cls += ' future'; label += ' — dispo le ' + st.date.toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}); }
    else { label += ' — non ouvert'; }
    return `<div class="${cls}">${label}</div>`;
  }).join('');

  const availableIds = allTestIds().filter(tid=>isTestAvailable(tid).avail);

  let selector = '';
  if(availableIds.length){
    selector = `
      <div class="nav-bar">
        <select id="testSelect">
          ${availableIds.map(tid=>`<option value="${tid}">${testLabel(tid)}</option>`).join('')}
        </select>
        <button id="startBtn">Commencer &#9654;</button>
      </div>`;
  }

  app.innerHTML = `
    ${selector}
    <div class="locked-panel">
      <h2>${availableIds.length ? 'Choisissez un test' : 'Aucun test disponible pour le moment'}</h2>
      <p>${availableIds.length ? 'Sélectionnez un test ouvert ci-dessus, ou consultez la disponibilité des autres tests ci-dessous.' : 'Revenez plus tard : votre enseignant ouvrira les tests au fur et à mesure.'}</p>
      <div class="test-grid">${tiles}</div>
    </div>`;

  if(availableIds.length){
    document.getElementById('startBtn').onclick = ()=>{
      currentTest = document.getElementById('testSelect').value;
      answers = {};
      if(isPart6(currentTest)){ p6Submitted = false; p6Answers = {}; p6TimeLeft = P6_DURATION; }
      else if(isMini(currentTest)){ miniSubmitted = false; miniAnswers = {}; miniTimeLeft = MINI_DURATION; }
      else { p5Submitted = false; p5TimeLeft = P5_DURATION; }
      render();
    };
  }
}

const P5_DURATION = 15*60; // 15 minutes
let p5TimeLeft = P5_DURATION;
let p5Interval = null;
let p5Submitted = false;

function renderTest(tid){
  const qs = QUESTIONS[tid];
  const total = qs.length;

  const nav = `
    <div class="nav-bar">
      <button id="backBtn">&#9664; Autres tests</button>
      <select id="testSelectInline">
        ${allTestIds().map(id=>{
          const avail = isTestAvailable(id).avail;
          return `<option value="${id}" ${id===tid?'selected':''} ${avail?'':'disabled'}>${testLabel(id)}${avail?'':' (fermé)'}</option>`;
        }).join('')}
      </select>
      <span class="p6-timer" id="p5Timer">${p6Format(p5TimeLeft)}</span>
    </div>
    <div class="status-line">Test ${tid} &middot; ${total} questions</div>
  `;

  let bodyHtml;
  if(p5Submitted){
    bodyHtml = renderPart5Correction(tid, qs);
  } else {
    const cards = qs.map(q=>renderQuestion(tid, q)).join('');
    const submitBtn = `<div style="text-align:center;margin:20px 0;"><button class="check-btn" style="width:auto;padding:12px 30px;" id="p5SubmitBtn">Corriger</button></div>`;
    bodyHtml = cards + submitBtn;
  }

  app.innerHTML = nav + bodyHtml;

  document.getElementById('backBtn').onclick = ()=>{
    if(p5Interval){ clearInterval(p5Interval); p5Interval=null; }
    p5Submitted=false; answers={};
    currentTest=null; render();
  };
  document.getElementById('testSelectInline').onchange = (e)=>{
    resetAllTestTimers();
    currentTest = e.target.value; render();
  };

  if(!p5Submitted){
    qs.forEach(q=>{
      const key = tid+'_'+q.num;
      ['A','B','C','D'].forEach(letter=>{
        const el = document.getElementById('opt_'+key+'_'+letter);
        if(el) el.onclick = ()=> selectOption(tid, q, letter);
      });
    });
    const btn = document.getElementById('p5SubmitBtn');
    if(btn) btn.onclick = ()=> p5Correct(tid);

    if(!p5Interval){
      p5Interval = setInterval(()=>{
        p5TimeLeft--;
        const timerEl = document.getElementById('p5Timer');
        if(timerEl){
          timerEl.textContent = p6Format(p5TimeLeft);
          if(p5TimeLeft <= 60) timerEl.classList.add('low');
        }
        if(p5TimeLeft <= 0){
          clearInterval(p5Interval); p5Interval=null;
          p5Correct(tid);
        }
      }, 1000);
    }
  }
}

function renderQuestion(tid, q){
  const key = tid+'_'+q.num;
  const sentence = q.sentence.replace('_______', '<span class="blank">_______</span>');
  const userAns = answers[key];

  const optionsHtml = ['A','B','C','D'].map(letter=>{
    let cls = 'opt';
    if(userAns===letter) cls += ' selected';
    return `<div class="${cls}" id="opt_${key}_${letter}">
      <span class="letter">${letter}</span><span>${q.options[letter]}</span>
    </div>`;
  }).join('');

  return `
    <div class="q-card">
      <span class="q-num">Question ${q.num}</span>
      <div class="q-sentence">${sentence}</div>
      <div class="options">${optionsHtml}</div>
    </div>`;
}

function selectOption(tid, q, letter){
  const key = tid+'_'+q.num;
  answers[key] = letter;
  renderTest(tid);
}

function p5Correct(tid){
  if(p5Interval){ clearInterval(p5Interval); p5Interval=null; }
  p5Submitted = true;
  renderTest(tid);
}

function renderPart5Correction(tid, qs){
  let score = 0;
  const wrong = [];
  qs.forEach(q=>{
    const key = tid+'_'+q.num;
    const userAns = answers[key];
    if(userAns === q.answer){
      score++;
    } else {
      wrong.push({
        num: q.num,
        sentence: q.sentence.replace('_______', '<span class="blank">_______</span>'),
        your: userAns ? `${userAns}) ${q.options[userAns]}` : 'Sans réponse',
        good: `${q.answer}) ${q.options[q.answer]}`,
        explanation: q.explanation
      });
    }
  });

  let html = `
    <div class="score-panel">
      <h2>Résultat</h2>
      <div class="big">${score} / ${qs.length}</div>
    </div>`;

  if(wrong.length === 0){
    html += '<div class="p6-allcorrect">Excellent — toutes les réponses sont correctes, aucune correction nécessaire.</div>';
  } else {
    html += wrong.map(w=>`
      <div class="p6-correction">
        <div class="qref">Question ${w.num}</div>
        <div class="q-sentence" style="font-size:.95rem;margin-bottom:10px;">${w.sentence}</div>
        <div>Votre réponse : <span class="your">${w.your}</span></div>
        <div>Bonne réponse : <span class="good">${w.good}</span></div>
        <div class="explain">${w.explanation}</div>
      </div>`).join('');
  }
  return html;
}

/* ---------- Part 6 : texte à trous ---------- */
const P6_DURATION = 8*60; // 8 minutes
let p6TimeLeft = P6_DURATION;
let p6Interval = null;
let p6Submitted = false;

function p6Format(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return m+':'+sec;
}

function renderPart6Test(tid){
  const realId = tid.slice(3);
  const test = QUESTIONS.p6[realId];

  if(!p6Interval && !p6Submitted){
    p6TimeLeft = P6_DURATION;
  }

  const nav = `
    <div class="nav-bar">
      <button id="backBtn">&#9664; Autres tests</button>
      <select id="testSelectInline">
        ${allTestIds().map(id=>{
          const avail = isTestAvailable(id).avail;
          return `<option value="${id}" ${id===tid?'selected':''} ${avail?'':'disabled'}>${testLabel(id)}${avail?'':' (fermé)'}</option>`;
        }).join('')}
      </select>
      <span class="p6-timer" id="p6Timer">${p6Format(p6TimeLeft)}</span>
    </div>
  `;

  const passagesHtml = test.passages.map(p=>{
    const bodyHtml = p.text.replace(/⟦(\d+)⟧/g, (m,n)=>`<span class="p6-blank">${n}</span>`);
    const qHtml = p.questions.map(q=>{
      const letters = ['A','B','C','D'];
      const optsHtml = q.options.map((o,i)=>`
        <label>
          <input type="radio" name="p6q${q.num}" value="${i}" ${p6Submitted?'disabled':''}
            ${p6Answers[q.num]===i?'checked':''}>
          (${letters[i]}) ${o}
        </label>`).join('');
      return `
        <div class="p6-qblock">
          <div class="qnum">Question ${q.num}${q.type==='insertion' ? ' — Quelle phrase complète le mieux le passage ?' : ''}</div>
          ${optsHtml}
        </div>`;
    }).join('');
    return `
      <div class="p6-passage">
        <div class="p6-passage-head">
          <div class="label">${p.label}</div>
          <div class="meta">${p.meta}</div>
        </div>
        <div class="p6-passage-body">${bodyHtml}</div>
        ${qHtml}
      </div>`;
  }).join('');

  const submitHtml = p6Submitted ? '' : `
    <div style="text-align:center;margin:20px 0;">
      <button class="check-btn" style="width:auto;padding:12px 30px;" id="p6SubmitBtn">Corriger</button>
    </div>`;

  const resultHtml = p6Submitted ? renderPart6Correction(test) : '';

  app.innerHTML = nav + passagesHtml + submitHtml + resultHtml;

  document.getElementById('backBtn').onclick = ()=>{
    if(p6Interval){ clearInterval(p6Interval); p6Interval = null; }
    p6Submitted = false; p6Answers = {};
    currentTest = null; render();
  };
  document.getElementById('testSelectInline').onchange = (e)=>{
    resetAllTestTimers();
    currentTest = e.target.value; render();
  };

  if(!p6Submitted){
    test.passages.forEach(p=>p.questions.forEach(q=>{
      document.getElementsByName('p6q'+q.num).forEach(radio=>{
        radio.onchange = (e)=>{ p6Answers[q.num] = parseInt(e.target.value); };
      });
    }));
    const btn = document.getElementById('p6SubmitBtn');
    if(btn) btn.onclick = ()=> p6Correct(tid);

    if(!p6Interval){
      p6Interval = setInterval(()=>{
        p6TimeLeft--;
        const timerEl = document.getElementById('p6Timer');
        if(timerEl){
          timerEl.textContent = p6Format(p6TimeLeft);
          if(p6TimeLeft <= 60) timerEl.classList.add('low');
        }
        if(p6TimeLeft <= 0){
          clearInterval(p6Interval); p6Interval = null;
          p6Correct(tid);
        }
      }, 1000);
    }
  }
}

let p6Answers = {};

function p6Correct(tid){
  if(p6Interval){ clearInterval(p6Interval); p6Interval = null; }
  p6Submitted = true;
  renderPart6Test(tid);
}

function renderPart6Correction(test){
  const letters = ['A','B','C','D'];
  let score = 0;
  const wrong = [];
  test.passages.forEach(p=>{
    p.questions.forEach(q=>{
      const chosen = p6Answers[q.num];
      if(chosen === q.correct){
        score++;
      } else {
        wrong.push({
          passageLabel: p.label,
          num: q.num,
          your: chosen === undefined ? 'Sans réponse' : `(${letters[chosen]}) ${q.options[chosen]}`,
          good: `(${letters[q.correct]}) ${q.options[q.correct]}`,
          explanation: q.explanation
        });
      }
    });
  });

  let html = `
    <div class="score-panel">
      <h2>Résultat</h2>
      <div class="big">${score} / 16</div>
    </div>`;

  if(wrong.length === 0){
    html += '<div class="p6-allcorrect">Excellent — toutes les réponses sont correctes, aucune correction nécessaire.</div>';
  } else {
    html += wrong.map(w=>`
      <div class="p6-correction">
        <div class="qref">${w.passageLabel} &middot; Question ${w.num}</div>
        <div>Votre réponse : <span class="your">${w.your}</span></div>
        <div>Bonne réponse : <span class="good">${w.good}</span></div>
        <div class="explain">${w.explanation}</div>
      </div>`).join('');
  }
  return html;
}

/* ---------- Mini Tests : Part 5 + Part 6 + Part 7 combinés ---------- */
const MINI_DURATION = 15*60; // 15 minutes
let miniTimeLeft = MINI_DURATION;
let miniInterval = null;
let miniSubmitted = false;
let miniAnswers = {}; // { qnum: 'A'/'B'/'C'/'D' for p5, or index 0-3 for p6/p7 }

function renderMiniTest(tid){
  const realId = tid.slice(5);
  const test = QUESTIONS.mini[realId];

  const nav = `
    <div class="nav-bar">
      <button id="backBtn">&#9664; Autres tests</button>
      <select id="testSelectInline">
        ${allTestIds().map(id=>{
          const avail = isTestAvailable(id).avail;
          return `<option value="${id}" ${id===tid?'selected':''} ${avail?'':'disabled'}>${testLabel(id)}${avail?'':' (fermé)'}</option>`;
        }).join('')}
      </select>
      <span class="p6-timer" id="miniTimer">${p6Format(miniTimeLeft)}</span>
    </div>
    <div class="status-line">${testLabel(tid)} &middot; 19 questions (Part 5, 6 &amp; 7)</div>
  `;

  let bodyHtml;
  if(miniSubmitted){
    bodyHtml = renderMiniCorrection(test);
  } else {
    const p5Html = `
      <h3 class="mini-section-title">PART 5 — Incomplete Sentences</h3>
      ${test.part5.map(q=>{
        const sentence = q.sentence.replace('_____', '<span class="blank">_____</span>');
        const letters = ['A','B','C','D'];
        const optsHtml = letters.map(letter=>{
          let cls = 'opt';
          if(miniAnswers['p5_'+q.num] === letter) cls += ' selected';
          return `<div class="${cls}" id="mini_opt_p5_${q.num}_${letter}">
            <span class="letter">${letter}</span><span>${q.options[letter]}</span>
          </div>`;
        }).join('');
        return `
          <div class="q-card">
            <span class="q-num">Question ${q.num}</span>
            <div class="q-sentence">${sentence}</div>
            <div class="options">${optsHtml}</div>
          </div>`;
      }).join('')}
    `;

    const p6Html = `
      <h3 class="mini-section-title">PART 6 — Text Completion</h3>
      ${test.part6.map(p=>{
        const bodyText = p.text.replace(/⟦(\d+)⟧/g, (m,n)=>`<span class="p6-blank">${n}</span>`);
        const qHtml = p.questions.map(q=>{
          const letters = ['A','B','C','D'];
          const optsHtml = q.options.map((o,i)=>`
            <label>
              <input type="radio" name="mini_p6q${q.num}" value="${i}" ${miniAnswers['p6_'+q.num]===i?'checked':''}>
              (${letters[i]}) ${o}
            </label>`).join('');
          return `<div class="p6-qblock"><div class="qnum">Question ${q.num}</div>${optsHtml}</div>`;
        }).join('');
        return `
          <div class="p6-passage">
            <div class="p6-passage-head"><div class="label">${p.label}</div><div class="meta">${p.meta}</div></div>
            <div class="p6-passage-body">${bodyText}</div>
            ${qHtml}
          </div>`;
      }).join('')}
    `;

    const p7Html = `
      <h3 class="mini-section-title">PART 7 — Reading Comprehension</h3>
      ${test.part7.map(p=>{
        const qHtml = p.questions.map(q=>{
          const letters = ['A','B','C','D'];
          const optsHtml = q.options.map((o,i)=>`
            <label>
              <input type="radio" name="mini_p7q${q.num}" value="${i}" ${miniAnswers['p7_'+q.num]===i?'checked':''}>
              (${letters[i]}) ${o}
            </label>`).join('');
          return `<div class="p6-qblock"><div class="qnum">Question ${q.num} — ${q.prompt}</div>${optsHtml}</div>`;
        }).join('');
        return `
          <div class="p6-passage">
            <div class="p6-passage-head"><div class="label">${p.label}</div><div class="meta">${p.meta}</div></div>
            <div class="p6-passage-body">${p.text}</div>
            ${qHtml}
          </div>`;
      }).join('')}
    `;

    const submitBtn = `<div style="text-align:center;margin:20px 0;"><button class="check-btn" style="width:auto;padding:12px 30px;" id="miniSubmitBtn">Corriger</button></div>`;
    bodyHtml = p5Html + p6Html + p7Html + submitBtn;
  }

  app.innerHTML = nav + bodyHtml;

  document.getElementById('backBtn').onclick = ()=>{
    resetAllTestTimers();
    currentTest = null; render();
  };
  document.getElementById('testSelectInline').onchange = (e)=>{
    resetAllTestTimers();
    currentTest = e.target.value; render();
  };

  if(!miniSubmitted){
    test.part5.forEach(q=>{
      ['A','B','C','D'].forEach(letter=>{
        const el = document.getElementById(`mini_opt_p5_${q.num}_${letter}`);
        if(el) el.onclick = ()=>{ miniAnswers['p5_'+q.num] = letter; renderMiniTest(tid); };
      });
    });
    test.part6.forEach(p=>p.questions.forEach(q=>{
      document.getElementsByName('mini_p6q'+q.num).forEach(radio=>{
        radio.onchange = (e)=>{ miniAnswers['p6_'+q.num] = parseInt(e.target.value); };
      });
    }));
    test.part7.forEach(p=>p.questions.forEach(q=>{
      document.getElementsByName('mini_p7q'+q.num).forEach(radio=>{
        radio.onchange = (e)=>{ miniAnswers['p7_'+q.num] = parseInt(e.target.value); };
      });
    }));

    const btn = document.getElementById('miniSubmitBtn');
    if(btn) btn.onclick = ()=> miniCorrect(tid);

    if(!miniInterval){
      miniInterval = setInterval(()=>{
        miniTimeLeft--;
        const timerEl = document.getElementById('miniTimer');
        if(timerEl){
          timerEl.textContent = p6Format(miniTimeLeft);
          if(miniTimeLeft <= 60) timerEl.classList.add('low');
        }
        if(miniTimeLeft <= 0){
          clearInterval(miniInterval); miniInterval = null;
          miniCorrect(tid);
        }
      }, 1000);
    }
  }
}

function miniCorrect(tid){
  if(miniInterval){ clearInterval(miniInterval); miniInterval = null; }
  miniSubmitted = true;
  renderMiniTest(tid);
}

function renderMiniCorrection(test){
  const letters = ['A','B','C','D'];
  let score = 0;
  const wrong = [];

  test.part5.forEach(q=>{
    const userAns = miniAnswers['p5_'+q.num];
    if(userAns === q.answer){ score++; }
    else {
      wrong.push({
        ref: `Part 5 · Question ${q.num}`,
        sentence: q.sentence.replace('_____', '<span class="blank">_____</span>'),
        your: userAns ? `${userAns}) ${q.options[userAns]}` : 'Sans réponse',
        good: `${q.answer}) ${q.options[q.answer]}`,
        explanation: q.explanation
      });
    }
  });

  test.part6.forEach(p=>p.questions.forEach(q=>{
    const userAns = miniAnswers['p6_'+q.num];
    if(userAns === q.correct){ score++; }
    else {
      wrong.push({
        ref: `Part 6 · ${p.label.split('—')[0].trim()} · Question ${q.num}`,
        sentence: '',
        your: userAns !== undefined ? `(${letters[userAns]}) ${q.options[userAns]}` : 'Sans réponse',
        good: `(${letters[q.correct]}) ${q.options[q.correct]}`,
        explanation: q.explanation
      });
    }
  }));

  test.part7.forEach(p=>p.questions.forEach(q=>{
    const userAns = miniAnswers['p7_'+q.num];
    if(userAns === q.correct){ score++; }
    else {
      wrong.push({
        ref: `Part 7 · ${p.label.split('—')[0].trim()} · Question ${q.num}`,
        sentence: q.prompt,
        your: userAns !== undefined ? `(${letters[userAns]}) ${q.options[userAns]}` : 'Sans réponse',
        good: `(${letters[q.correct]}) ${q.options[q.correct]}`,
        explanation: q.explanation
      });
    }
  }));

  let html = `
    <div class="score-panel">
      <h2>Résultat</h2>
      <div class="big">${score} / 19</div>
    </div>`;

  if(wrong.length === 0){
    html += '<div class="p6-allcorrect">Excellent — toutes les réponses sont correctes, aucune correction nécessaire.</div>';
  } else {
    html += wrong.map(w=>`
      <div class="p6-correction">
        <div class="qref">${w.ref}</div>
        ${w.sentence ? `<div style="margin-bottom:8px;">${w.sentence}</div>` : ''}
        <div>Votre réponse : <span class="your">${w.your}</span></div>
        <div>Bonne réponse : <span class="good">${w.good}</span></div>
        <div class="explain">${w.explanation}</div>
      </div>`).join('');
  }
  return html;
}

boot();
</script>
</body>
</html>
