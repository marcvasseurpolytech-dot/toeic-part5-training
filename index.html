<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOEIC Part 5 : Incomplete Sentences | Polytech Lille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0f1f3d;
  --navy-light:#1c2f52;
  --gold:#c8a24a;
  --gold-light:#e0c589;
  --cream:#faf6ec;
  --cream-dark:#f0e9d8;
  --text:#1c2230;
  --muted:#6b6f7d;
  --ok:#3f7a4f;
  --bad:#a4372d;
  --border:#ddd3b8;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Source Serif 4',serif;
  background:var(--cream);
  color:var(--text);
  min-height:100vh;
}
header{
  background:var(--navy);
  color:var(--cream);
  padding:28px 24px 22px;
  text-align:center;
  border-bottom:4px solid var(--gold);
}
header h1{
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:1.7rem;
  margin:0 0 6px;
  letter-spacing:.3px;
}
header p{
  margin:0;
  color:var(--gold-light);
  font-size:.95rem;
  letter-spacing:.5px;
}
.wrap{max-width:880px;margin:0 auto;padding:24px 20px 60px;}

.nav-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:#fff;border:1px solid var(--border);border-radius:8px;
  padding:14px 16px;margin-bottom:22px;
}
.nav-bar select{
  font-family:'Source Serif 4',serif;
  font-size:1rem;padding:8px 12px;border-radius:6px;
  border:1px solid var(--border);background:var(--cream);color:var(--text);
  flex:1;min-width:180px;
}
.nav-bar button{
  font-family:'Source Serif 4',serif;
  background:var(--navy);color:var(--cream);border:none;
  padding:9px 16px;border-radius:6px;cursor:pointer;font-size:1rem;
}
.nav-bar button:disabled{opacity:.35;cursor:not-allowed;}
.nav-bar button:hover:not(:disabled){background:var(--navy-light);}

.status-line{
  font-size:.85rem;color:var(--muted);margin:-10px 0 20px;text-align:center;
}

.locked-panel, .closed-panel{
  background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:40px 30px;text-align:center;
}
.closed-panel{border-color:var(--bad);}
.locked-panel h2, .closed-panel h2{
  font-family:'Playfair Display',serif;color:var(--navy);margin-top:0;
}
.closed-panel h2{color:var(--bad);}
.lock-icon{font-size:2.4rem;margin-bottom:10px;}

.test-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;margin-top:18px;
}
.test-tile{
  border:1px solid var(--border);border-radius:8px;padding:12px;
  background:var(--cream-dark);font-size:.85rem;
}
.test-tile.avail{background:#eaf3ec;border-color:var(--ok);color:var(--ok);font-weight:600;}
.test-tile.future{background:#fdf6e3;border-color:var(--gold);color:#8a6d1c;}

.q-card{
  background:#fff;border:1px solid var(--border);border-radius:10px;
  padding:26px 28px;margin-bottom:18px;
}
.q-num{
  display:inline-block;background:var(--navy);color:var(--gold-light);
  font-family:'JetBrains Mono',monospace;font-size:.8rem;
  padding:3px 10px;border-radius:20px;margin-bottom:12px;
}
.q-sentence{font-size:1.12rem;line-height:1.6;margin-bottom:18px;}
.q-sentence .blank{color:var(--gold);font-weight:600;letter-spacing:1px;}
.options{display:grid;gap:8px;}
.opt{
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--border);border-radius:7px;padding:10px 14px;
  cursor:pointer;transition:.15s;background:var(--cream);
}
.opt:hover{border-color:var(--gold);}
.opt.selected{border-color:var(--navy);background:#eef1f7;}
.opt.correct{border-color:var(--ok);background:#eaf3ec;}
.opt.incorrect{border-color:var(--bad);background:#f7eae8;}
.opt .letter{
  font-family:'JetBrains Mono',monospace;font-weight:600;
  color:var(--navy);width:20px;
}
.explanation{
  margin-top:14px;padding:14px 16px;border-left:3px solid var(--gold);
  background:var(--cream-dark);font-size:.92rem;line-height:1.55;color:var(--text);
  border-radius:0 6px 6px 0;
}
.explanation em{color:var(--navy);font-style:normal;font-weight:600;}

.score-panel{
  background:var(--navy);color:var(--cream);border-radius:10px;
  padding:26px;text-align:center;margin-bottom:20px;
}
.score-panel h2{font-family:'Playfair Display',serif;margin:0 0 8px;color:var(--gold-light);}
.score-panel .big{font-size:2.2rem;font-weight:700;color:var(--gold);}

.check-btn{
  display:block;width:100%;margin-top:8px;
  font-family:'Source Serif 4',serif;font-size:1rem;
  background:var(--gold);color:var(--navy);border:none;font-weight:600;
  padding:12px;border-radius:7px;cursor:pointer;
}
.check-btn:hover{background:var(--gold-light);}
.check-btn:disabled{opacity:.4;cursor:not-allowed;}

footer{
  text-align:center;padding:26px 20px 40px;color:var(--muted);font-size:.8rem;
  border-top:1px solid var(--border);margin-top:30px;
}
footer strong{color:var(--navy);}
</style>
</head>
<body>

<header>
  <h1>TOEIC® Part 5 : Incomplete Sentences</h1>
  <p>10 tests d'entraînement autonome &middot; 30 questions chacun</p>
</header>

<div class="wrap" id="app">
  <div class="status-line" id="statusLine">Chargement...</div>
</div>

<footer>
  <strong>Marc Vasseur</strong> | POLYTECH LILLE &middot; marc.vasseur@polytech-lille.fr
</footer>

<script>
const DATA_URL = 'data.json';
const ACCESS_URL = 'access.json?t=' + Date.now();

let QUESTIONS = null;
let ACCESS = null;
let currentTest = null;
let answers = {};      // { qnum: 'A' }
let checked = {};      // { qnum: true }

const app = document.getElementById('app');
const statusLine = document.getElementById('statusLine');

async function boot(){
  try{
    const [q, a] = await Promise.all([
      fetch(DATA_URL).then(r=>r.json()),
      fetch(ACCESS_URL).then(r=>r.json())
    ]);
    QUESTIONS = q;
    ACCESS = a;
    render();
  }catch(e){
    app.innerHTML = '<div class="locked-panel"><div class="lock-icon">&#9888;</div><h2>Erreur de chargement</h2><p>Impossible de charger les données. Contactez votre enseignant.</p></div>';
  }
}

function isTestAvailable(tid){
  const t = ACCESS.tests[tid];
  if(!t || !t.unlocked) return {avail:false, future:false};
  if(t.unlock_date){
    const d = new Date(t.unlock_date);
    if(d.getTime() > Date.now()) return {avail:false, future:true, date:d};
  }
  return {avail:true, future:false};
}

function render(){
  statusLine.textContent = '';

  if(ACCESS.closed){
    app.innerHTML = `
      <div class="closed-panel">
        <div class="lock-icon">&#128274;</div>
        <h2>Session fermée</h2>
        <p>L'accès aux tests est actuellement fermé par votre enseignant.</p>
      </div>`;
    return;
  }

  if(currentTest && isTestAvailable(currentTest).avail){
    renderTest(currentTest);
    return;
  }

  currentTest = null;
  renderTestPicker();
}

function renderTestPicker(){
  const tiles = Object.keys(QUESTIONS).sort((a,b)=>+a-+b).map(tid=>{
    const st = isTestAvailable(tid);
    let cls = 'test-tile', label = `Test ${tid}`;
    if(st.avail){ cls += ' avail'; label += ' — disponible'; }
    else if(st.future){ cls += ' future'; label += ' — dispo le ' + st.date.toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}); }
    else { label += ' — non ouvert'; }
    return `<div class="${cls}">${label}</div>`;
  }).join('');

  const availableIds = Object.keys(QUESTIONS).sort((a,b)=>+a-+b).filter(tid=>isTestAvailable(tid).avail);

  let selector = '';
  if(availableIds.length){
    selector = `
      <div class="nav-bar">
        <select id="testSelect">
          ${availableIds.map(tid=>`<option value="${tid}">Test ${tid}</option>`).join('')}
        </select>
        <button id="startBtn">Commencer &#9654;</button>
      </div>`;
  }

  app.innerHTML = `
    ${selector}
    <div class="locked-panel">
      <h2>${availableIds.length ? 'Choisissez un test' : 'Aucun test disponible pour le moment'}</h2>
      <p>${availableIds.length ? 'Sélectionnez un test ouvert ci-dessus, ou consultez la disponibilité des autres tests ci-dessous.' : 'Revenez plus tard : votre enseignant ouvrira les tests au fur et à mesure.'}</p>
      <div class="test-grid">${tiles}</div>
    </div>`;

  if(availableIds.length){
    document.getElementById('startBtn').onclick = ()=>{
      currentTest = document.getElementById('testSelect').value;
      answers = {}; checked = {};
      render();
    };
  }
}

function renderTest(tid){
  const qs = QUESTIONS[tid];
  const total = qs.length;
  const answeredCount = Object.keys(checked).filter(k=>k.startsWith(tid+'_')).length;

  const nav = `
    <div class="nav-bar">
      <button id="backBtn">&#9664; Autres tests</button>
      <select id="testSelectInline">
        ${Object.keys(QUESTIONS).sort((a,b)=>+a-+b).map(id=>{
          const avail = isTestAvailable(id).avail;
          return `<option value="${id}" ${id===tid?'selected':''} ${avail?'':'disabled'}>Test ${id}${avail?'':' (fermé)'}</option>`;
        }).join('')}
      </select>
    </div>
    <div class="status-line">Test ${tid} &middot; ${answeredCount}/${total} question(s) vérifiée(s)</div>
  `;

  let scoreHtml = '';
  if(answeredCount === total){
    let score = 0;
    qs.forEach(q=>{ if(answers[tid+'_'+q.num] === q.answer) score++; });
    scoreHtml = `
      <div class="score-panel">
        <h2>Résultat</h2>
        <div class="big">${score} / ${total}</div>
      </div>`;
  }

  const cards = qs.map(q=>renderQuestion(tid, q)).join('');

  app.innerHTML = nav + scoreHtml + cards;

  document.getElementById('backBtn').onclick = ()=>{ currentTest=null; render(); };
  document.getElementById('testSelectInline').onchange = (e)=>{
    currentTest = e.target.value; answers={}; checked={}; render();
  };

  qs.forEach(q=>{
    const key = tid+'_'+q.num;
    ['A','B','C','D'].forEach(letter=>{
      const el = document.getElementById('opt_'+key+'_'+letter);
      if(el) el.onclick = ()=> selectOption(tid, q, letter);
    });
    const btn = document.getElementById('check_'+key);
    if(btn) btn.onclick = ()=> checkAnswer(tid, q);
  });
}

function renderQuestion(tid, q){
  const key = tid+'_'+q.num;
  const sentence = q.sentence.replace('_______', '<span class="blank">_______</span>');
  const isChecked = !!checked[key];
  const userAns = answers[key];

  const optionsHtml = ['A','B','C','D'].map(letter=>{
    let cls = 'opt';
    if(!isChecked && userAns===letter) cls += ' selected';
    if(isChecked){
      if(letter === q.answer) cls += ' correct';
      else if(letter === userAns) cls += ' incorrect';
    }
    return `<div class="${cls}" id="opt_${key}_${letter}">
      <span class="letter">${letter}</span><span>${q.options[letter]}</span>
    </div>`;
  }).join('');

  const explanationHtml = isChecked ? `
    <div class="explanation"><em>Réponse : ${q.answer}) ${q.options[q.answer]}.</em><br>${q.explanation}</div>
  ` : '';

  const btnHtml = isChecked ? '' : `<button class="check-btn" id="check_${key}" ${userAns?'':'disabled'}>Vérifier ma réponse</button>`;

  return `
    <div class="q-card">
      <span class="q-num">Question ${q.num}</span>
      <div class="q-sentence">${sentence}</div>
      <div class="options">${optionsHtml}</div>
      ${btnHtml}
      ${explanationHtml}
    </div>`;
}

function selectOption(tid, q, letter){
  const key = tid+'_'+q.num;
  if(checked[key]) return;
  answers[key] = letter;
  renderTest(tid);
}

function checkAnswer(tid, q){
  const key = tid+'_'+q.num;
  if(!answers[key]) return;
  checked[key] = true;
  renderTest(tid);
}

boot();
</script>
</body>
</html>
